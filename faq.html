<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .faq-hero {
    background: var(--pink-main);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px var(--card-shadow);
  }
  body.blue .faq-hero {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    color: #0f172a;
  }
  .faq-hero h2 {
    font-size: 20px; font-weight: 700; margin-bottom: 8px;
  }
  .faq-hero p {
    font-size: 13px; opacity: 0.9; margin-bottom: 16px;
  }

  .faq-search-wrap {
    position: relative;
  }
  .faq-search-box {
    width: 100%; padding: 14px 42px 14px 42px;
    border: none; border-radius: 12px; font-size: 14px;
    font-family: inherit; outline: none;
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23e0568a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 14px center;
    color: #333;
  }
  .faq-search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #ffe4ec;
    color: var(--pink-main);
    font-size: 13px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .faq-search-clear.show { display: flex; }
  .faq-search-clear:active { transform: translateY(-50%) scale(0.9); }

  .faq-categories {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 15px; margin-bottom: 10px;
    scrollbar-width: none;
  }
  .faq-categories::-webkit-scrollbar { display: none; }

  .faq-cat-btn {
    padding: 8px 14px; border-radius: 20px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    font-size: 13px; font-weight: 600; color: var(--pink-dark);
    white-space: nowrap; cursor: pointer; font-family: inherit;
    transition: 0.2s; box-shadow: 0 2px 6px var(--card-shadow);
  }
  .faq-cat-btn.active {
    background: var(--pink-main); color: #fff;
    border-color: var(--pink-main);
  }

  .faq-group { margin-bottom: 24px; }
  .faq-group-title {
    font-size: 15px; font-weight: 800; color: var(--pink-main);
    margin-bottom: 12px; padding-left: 8px;
    border-left: 4px solid var(--pink-main);
    display: flex; align-items: center; gap: 8px;
  }

  .faq-card {
    background: var(--card-bg); border-radius: 16px;
    box-shadow: 0 4px 15px var(--card-shadow);
    overflow: hidden; border: 1px solid var(--border-color);
  }

  .faq-item { border-bottom: 1px solid var(--border-color); transition: background 0.2s; }
  .faq-item:last-child { border-bottom: none; }

  .faq-question {
    padding: 16px; font-size: 14.5px; font-weight: 600;
    color: var(--text); cursor: pointer;
    display: flex; justify-content: space-between;
    align-items: center; line-height: 1.5;
    gap: 10px;
  }
  .faq-question.active {
    color: var(--pink-main); background: var(--pink-light);
  }
  .faq-icon {
    font-size: 14px; color: var(--pink-dark);
    transition: transform 0.3s; flex-shrink: 0;
  }
  .faq-question.active .faq-icon {
    transform: rotate(180deg); color: var(--pink-main);
  }

  .faq-answer {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease-out;
    background: var(--pink-light);
  }
  .faq-answer-content {
    padding: 14px 16px; font-size: 14px; color: var(--text);
    line-height: 1.7; border-top: 1px dashed var(--border-color);
  }
  .faq-answer.open { max-height: 2000px; }

  .no-results {
    text-align: center; padding: 40px 20px;
    color: var(--pink-dark); display: none;
  }
  .no-results.show { display: block; }
  .no-results .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
</style>

  // ============================================================
  // State
  // ============================================================
  let currentCategory = 'all';
  let searchQuery = '';

  // ============================================================
  // ভাষা
  // ============================================================
  function updatePageTexts() {
    if (!window.Lang) return;

    const setText = (id, txt) => {
      const el = document.getElementById(id);
      if (el) el.textContent = txt;
    };

    setText('pageTitle', window.Lang.faqTitle());
    setText('pageSubtitle', window.Lang.faqSubtitle());
    setText('heroTitle', window.Lang.faqHeroTitle());
    setText('heroSub', window.Lang.faqHeroSub());
    setText('noResultsText', window.Lang.faqNoResults());

    const search = document.getElementById('faqSearch');
    if (search) search.placeholder = window.Lang.faqSearchPlaceholder();

    document.title = window.Lang.faqTitle();
  }

  // ============================================================
  // Render
  // ============================================================
  function renderFaqPage() {
    const isEnNow = isEn();

    // Category buttons
    const catContainer = document.getElementById('catContainer');
    if (catContainer) {
      let catHtml = `<button class="faq-cat-btn ${currentCategory === 'all' ? 'active' : ''}" data-cat="all" type="button">${isEnNow ? 'All' : 'সবগুলো'}</button>`;
      FAQ_DATA.forEach(g => {
        catHtml += `<button class="faq-cat-btn ${currentCategory === g.id ? 'active' : ''}" data-cat="${g.id}" type="button">${isEnNow ? g.enTitle : g.bnTitle}</button>`;
      });
      catContainer.innerHTML = catHtml;

      catContainer.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => filterCategory(btn.dataset.cat));
      });
    }

    // Q&A groups
    const content = document.getElementById('faqContent');
    if (!content) return;

    let html = '';
    FAQ_DATA.forEach(g => {
      html += `<div class="faq-group" data-category="${g.id}">`;
      html += `<div class="faq-group-title">${isEnNow ? g.enTitle : g.bnTitle}</div>`;
      html += `<div class="faq-card">`;

      g.items.forEach(item => {
        html += `
          <div class="faq-item">
            <div class="faq-question" data-q="1">
              <span>${escapeHtml(isEnNow ? item.enQ : item.bnQ)}</span>
              <span class="faq-icon">▼</span>
            </div>
            <div class="faq-answer">
              <div class="faq-answer-content">
                ${escapeHtml(isEnNow ? item.enA : item.bnA)}
              </div>
            </div>
          </div>
        `;
      });

      html += `</div></div>`;
    });

    content.innerHTML = html;

    // Event bindings
    content.querySelectorAll('.faq-question').forEach(el => {
      el.addEventListener('click', () => toggleFaq(el));
    });

    applyFilters();
  }

  // ============================================================
  // Toggle FAQ
  // ============================================================
  function toggleFaq(element) {
    const isActive = element.classList.contains('active');
    element.classList.toggle('active');

    const answer = element.nextElementSibling;
    if (!answer) return;

    if (isActive) {
      answer.classList.remove('open');
      answer.style.maxHeight = null;
    } else {
      answer.classList.add('open');
      // ✅ scrollHeight ব্যবহার করে নির্ভুল উচ্চতা
      answer.style.maxHeight = answer.scrollHeight + 'px';
    }
  }

  // ============================================================
  // Filter
  // ============================================================
  function filterCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.faq-cat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === cat);
    });
    applyFilters();
  }

  function applyFilters() {
    const groups = document.querySelectorAll('.faq-group');
    const noResults = document.getElementById('noResults');
    let visibleCount = 0;

    groups.forEach(group => {
      const groupCat = group.dataset.category;
      const items = group.querySelectorAll('.faq-item');
      let groupHasVisibleItems = false;

      items.forEach(item => {
        const qText = item.querySelector('.faq-question').textContent.toLowerCase();
        const aText = item.querySelector('.faq-answer-content').textContent.toLowerCase();

        const matchCategory = (currentCategory === 'all' || groupCat === currentCategory);
        const matchSearch = !searchQuery || qText.includes(searchQuery) || aText.includes(searchQuery);

        if (matchCategory && matchSearch) {
          item.style.display = 'block';
          groupHasVisibleItems = true;
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      group.style.display = groupHasVisibleItems ? 'block' : 'none';
    });

    if (noResults) {
      noResults.classList.toggle('show', visibleCount === 0);
    }

    // Clear button
    const clearBtn = document.getElementById('faqSearchClear');
    if (clearBtn) clearBtn.classList.toggle('show', !!searchQuery);
  }

  // ============================================================
  // Search
  // ============================================================
  const searchInput = document.getElementById('faqSearch');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      applyFilters();
    });
  }

  const clearBtn = document.getElementById('faqSearchClear');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      if (searchInput) searchInput.value = '';
      searchQuery = '';
      applyFilters();
    });
  }

  // ============================================================
  // pageshow
  // ============================================================
  window.addEventListener('pageshow', (e) => {
    if (e.persisted || document.visibilityState === 'visible') {
      const savedLang = (JSON.parse(localStorage.getItem('pinkDiaryProfile')) || {}).language || 'bn';
      const currentLang = window.Lang ? window.Lang.lang() : 'bn';
      if (savedLang !== currentLang) {
        location.reload();
        return;
      }
      updatePageTexts();
      renderFaqPage();
    }
  });

  // ============================================================
  // Init
  // ============================================================
  updatePageTexts();
  renderFaqPage();

})();
</script>

<script src="theme.js"></script>
